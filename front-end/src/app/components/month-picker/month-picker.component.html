<div class="grid grid-col space-y-2">
  <label for="month" class="text-sm font-semibold text-gray-700">Selecciona mes y año</label>
  <input
    id="month"
    type="month"
    class="p-2 rounded-md border border-gray-300 shadow-sm focus:ring focus:ring-blue-300 focus:outline-none"
    (change)="onDateChange($event)"
    placeholder="YYYY-MM"
  />
</div>
