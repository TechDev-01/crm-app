<div class="fixed inset-0 bg-white/10 backdrop-blur-sm z-50 flex items-center justify-center">
  <!-- Contenido del modal -->
  <div class="bg-white/80 backdrop-blur-md rounded-xl shadow-2xl p-6 w-full max-w-md relative border border-white/30">
    <h2 class="text-xl font-semibold mb-4">Agregar Gasto</h2>
    
    <!-- Aquí va tu formulario -->
    <form (ngSubmit)="gastoAdded.emit()">
      <input type="text" placeholder="Categoría" class="w-full p-2 mb-4 border border-gray-300 rounded">
      <textarea placeholder="Descripción" class="w-full p-2 mb-4 border border-gray-300 rounded"></textarea>
      <input type="number" placeholder="Monto" class="w-full p-2 mb-4 border border-gray-300 rounded" required>
      <input type="date" placeholder="Fecha" class="w-full p-2 mb-4 border border-gray-300 rounded" required>
      <input type="text" placeholder="Método de Pago" class="w-full p-2 mb-4 border border-gray-300 rounded">
      <input type="text" placeholder="Usuario" class="w-full p-2 mb-4 border border-gray-300 rounded">
      <input type="text" placeholder="Comprobante de Pago" class="w-full p-2 mb-4 border border-gray-300 rounded">
      <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Guardar Gasto</button>
      <button type="button" (click)="cerrarModal.emit()" class="w-full bg-gray-300 text-gray-700 p-2 rounded mt-2 hover:bg-gray-400">Cancelar</button>
    </form>

    <!-- Botón de cerrar -->
    <button 
      (click)="cerrarModal.emit()" 
      class="absolute top-2 right-2 text-gray-500 hover:text-gray-800"
    >
      ✕
    </button>
  </div>
</div>
